# Day 1: only Qdrant. The app and MCP server get added on Day 6.
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: uknest-qdrant
    ports:
      - "6333:6333"   # REST API + dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
